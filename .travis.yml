language: php

php:
  - 8.2.35

before_script:
  - composer update --prefer-dist $DEPENDENCIES

script:
  - vendor/bin/phpunit --coverage-text --coverage-clover=clover.xml --colors

after_script:
  - if [ $TRAVIS_PHP_VERSION = '8.2.35' ]; then wget https://scrutinizer-ci.com/ocular.phar; php ocular.phar code-coverage:upload --format=php-clover clover.xml; fi
